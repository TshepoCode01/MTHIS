<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MTHIS Tutorials | Learner Registration</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            min-height: 100vh;

            background:
                linear-gradient(
                    rgba(4, 19, 38, 0.94),
                    rgba(7, 26, 51, 0.96)
                ),
                radial-gradient(
                    circle at top right,
                    #00b894,
                    #071a33 60%
                );

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 30px 15px;

            color: #172033;
        }

        .register-container {
            width: 100%;
            max-width: 600px;

            animation: pageEnter 0.6s ease;
        }

        @keyframes pageEnter {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* ==========================================
           LOGO / BRAND
        ========================================== */

        .logo-area {
            text-align: center;
            color: white;
            margin-bottom: 25px;
        }

        .logo {
            width: 62px;
            height: 62px;

            margin: 0 auto 12px;

            background: #00b894;

            border-radius: 15px;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 22px;
            font-weight: bold;

            box-shadow:
                0 8px 25px rgba(0, 184, 148, 0.35);

            animation: logoPulse 3s ease-in-out infinite;
        }

        @keyframes logoPulse {
            0%,
            100% {
                transform: scale(1);
                box-shadow:
                    0 8px 25px rgba(0, 184, 148, 0.35);
            }

            50% {
                transform: scale(1.04);
                box-shadow:
                    0 12px 35px rgba(0, 214, 160, 0.5);
            }
        }

        .logo-area h1 {
            font-size: 28px;
        }

        .logo-area h1 span {
            color: #00d6a0;
        }

        .logo-area p {
            margin-top: 5px;
            color: #cbd5e1;
            font-size: 14px;
        }

        /* ==========================================
           CARD
        ========================================== */

        .card {
            background: white;

            border-radius: 20px;

            padding: 35px;

            box-shadow:
                0 25px 70px rgba(0, 0, 0, 0.35);

            animation: cardEnter 0.7s ease;
        }

        @keyframes cardEnter {
            from {
                opacity: 0;
                transform: translateY(15px) scale(0.98);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .card-header {
            margin-bottom: 25px;
        }

        .card-header h2 {
            color: #071a33;
            font-size: 28px;
            margin-bottom: 8px;
        }

        .card-header p {
            color: #667085;
            font-size: 14px;
            line-height: 1.5;
        }

        /* ==========================================
           FORM
        ========================================== */

        .form-grid {
            display: grid;

            grid-template-columns: 1fr 1fr;

            gap: 18px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .full {
            grid-column: 1 / -1;
        }

        label {
            display: block;

            margin-bottom: 7px;

            font-weight: bold;

            font-size: 14px;

            color: #172033;
        }

        input,
        select {
            width: 100%;

            padding: 14px;

            border: 1px solid #d5dbe4;

            border-radius: 9px;

            font-size: 15px;

            outline: none;

            background: #fff;

            transition:
                border-color 0.2s ease,
                box-shadow 0.2s ease,
                transform 0.2s ease;
        }

        input:hover,
        select:hover {
            border-color: #aab4c3;
        }

        input:focus,
        select:focus {
            border-color: #00b894;

            box-shadow:
                0 0 0 3px rgba(0, 184, 148, 0.10);

            transform: translateY(-1px);
        }

        input::placeholder {
            color: #98a2b3;
        }

        .password-note {
            font-size: 12px;

            color: #667085;

            margin-top: 6px;
        }

        /* ==========================================
           BUTTON
        ========================================== */

        .register-btn {
            width: 100%;

            border: none;

            padding: 15px;

            border-radius: 9px;

            background: #00b894;

            color: white;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;

            transition:
                background 0.25s ease,
                transform 0.25s ease,
                box-shadow 0.25s ease;

            margin-top: 5px;
        }

        .register-btn:hover {
            background: #00a383;

            transform: translateY(-2px);

            box-shadow:
                0 8px 20px rgba(0, 184, 148, 0.25);
        }

        .register-btn:active {
            transform: translateY(0);
        }

        .register-btn:disabled {
            background: #8ccfc1;

            cursor: not-allowed;

            transform: none;

            box-shadow: none;
        }

        /* ==========================================
           MESSAGE
        ========================================== */

        .message {
            display: none;

            padding: 13px;

            border-radius: 8px;

            margin-bottom: 18px;

            font-size: 14px;

            line-height: 1.5;
        }

        .message.show {
            display: block;

            animation: messageIn 0.3s ease;
        }

        @keyframes messageIn {
            from {
                opacity: 0;
                transform: translateY(-5px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message.error {
            background: #fff1f2;

            color: #b42318;

            border: 1px solid #fecdca;
        }

        .message.success {
            background: #ecfdf3;

            color: #027a48;

            border: 1px solid #abefc6;
        }

        .message.loading {
            background: #eff8ff;

            color: #175cd3;

            border: 1px solid #b2ddff;
        }

        /* ==========================================
           LINKS
        ========================================== */

        .bottom-links {
            text-align: center;

            margin-top: 22px;

            font-size: 14px;

            color: #667085;
        }

        .bottom-links a {
            color: #008f72;

            font-weight: bold;

            text-decoration: none;

            transition: color 0.2s ease;
        }

        .bottom-links a:hover {
            color: #00b894;

            text-decoration: underline;
        }

        .back-home {
            display: block;

            text-align: center;

            margin-top: 18px;

            color: #dbe5f0;

            text-decoration: none;

            font-size: 14px;

            transition: color 0.2s ease;
        }

        .back-home:hover {
            color: #00d6a0;
        }

        /* ==========================================
           MOBILE
        ========================================== */

        @media (max-width: 600px) {

            body {
                padding: 20px 12px;
            }

            .card {
                padding: 25px 20px;

                border-radius: 16px;
            }

            .form-grid {
                grid-template-columns: 1fr;

                gap: 0;
            }

            .full {
                grid-column: auto;
            }

            .logo-area h1 {
                font-size: 24px;
            }

            .logo-area p {
                font-size: 13px;
            }

            .card-header h2 {
                font-size: 24px;
            }

            input,
            select {
                padding: 13px;
            }

            .register-btn {
                padding: 14px;
            }
        }

        @media (max-width: 380px) {

            .card {
                padding: 22px 16px;
            }

            .logo {
                width: 56px;
                height: 56px;
            }

            .logo-area h1 {
                font-size: 22px;
            }

            .card-header h2 {
                font-size: 22px;
            }
        }
    </style>
</head>


<body>

<div class="register-container">

    <!-- ==========================================
         LOGO / BRAND
    =========================================== -->

    <div class="logo-area">

        <div class="logo">
            MT
        </div>

        <h1>
            MTHIS <span>Tutorials</span>
        </h1>

        <p>
            Grade 11 & 12 Mathematics & Physical Science
        </p>

    </div>


    <!-- ==========================================
         REGISTRATION CARD
    =========================================== -->

    <div class="card">

        <div class="card-header">

            <h2>
                Create Learner Account
            </h2>

            <p>
                Register to access your MTHIS Tutorials learner portal.
            </p>

        </div>


        <!-- ======================================
             MESSAGE
        ======================================= -->

        <div
            id="message"
            class="message">
        </div>


        <!-- ======================================
             REGISTRATION FORM
        ======================================= -->

        <form
            id="registrationForm"
            onsubmit="registerLearner(event)"
            novalidate>

            <div class="form-grid">


                <!-- NAME -->

                <div class="form-group">

                    <label for="name">
                        Name *
                    </label>

                    <input
                        type="text"
                        id="name"
                        name="name"
                        placeholder="Enter your name"
                        autocomplete="given-name"
                        required>

                </div>


                <!-- SURNAME -->

                <div class="form-group">

                    <label for="surname">
                        Surname *
                    </label>

                    <input
                        type="text"
                        id="surname"
                        name="surname"
                        placeholder="Enter your surname"
                        autocomplete="family-name"
                        required>

                </div>


                <!-- EMAIL -->

                <div class="form-group full">

                    <label for="email">
                        Email Address *
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="example@email.com"
                        autocomplete="email"
                        required>

                </div>


                <!-- CONTACT -->

                <div class="form-group">

                    <label for="contact">
                        Contact Number *
                    </label>

                    <input
                        type="tel"
                        id="contact"
                        name="contact"
                        placeholder="081 234 5678"
                        autocomplete="tel"
                        required>

                </div>


                <!-- GRADE -->

                <div class="form-group">

                    <label for="grade">
                        Grade *
                    </label>

                    <select
                        id="grade"
                        name="grade"
                        required>

                        <option value="">
                            Select Grade
                        </option>

                        <option value="Grade 11">
                            Grade 11
                        </option>

                        <option value="Grade 12">
                            Grade 12
                        </option>

                    </select>

                </div>


                <!-- SUBJECT -->

                <div class="form-group full">

                    <label for="subject">
                        Subject *
                    </label>

                    <select
                        id="subject"
                        name="subject"
                        required>

                        <option value="">
                            Select Subject
                        </option>

                        <option value="Mathematics">
                            Mathematics
                        </option>

                        <option value="Physical Science">
                            Physical Science
                        </option>

                        <option value="Both">
                            Mathematics & Physical Science
                        </option>

                    </select>

                </div>


                <!-- PASSWORD -->

                <div class="form-group">

                    <label for="password">
                        Password *
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        minlength="6"
                        placeholder="Minimum 6 characters"
                        autocomplete="new-password"
                        required>

                    <div class="password-note">
                        Your password must contain at least 6 characters.
                    </div>

                </div>


                <!-- CONFIRM PASSWORD -->

                <div class="form-group">

                    <label for="confirmPassword">
                        Confirm Password *
                    </label>

                    <input
                        type="password"
                        id="confirmPassword"
                        name="confirmPassword"
                        minlength="6"
                        placeholder="Repeat your password"
                        autocomplete="new-password"
                        required>

                </div>


                <!-- BUTTON -->

                <div class="form-group full">

                    <button
                        id="registerButton"
                        class="register-btn"
                        type="submit">

                        Create Learner Account

                    </button>

                </div>

            </div>

        </form>


        <!-- ======================================
             LOGIN LINK
        ======================================= -->

        <div class="bottom-links">

            Already have an account?

            <a href="login.html">
                Login
            </a>

        </div>

    </div>


    <!-- ==========================================
         HOME LINK
    =========================================== -->

    <a
        href="index.html"
        class="back-home">

        Back to MTHIS Tutorials

    </a>

</div>


<!-- ==========================================
     SUPABASE
=========================================== -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script>

    /* ==========================================
       SUPABASE CONFIG
    ========================================== */

    const SUPABASE_URL =
        "https://bcpxdigpblgolreftfjx.supabase.co";

    const SUPABASE_ANON_KEY =
        "sb_publishable_KMj2CtNM_uqqc5pjVh8V2Q_w9xydiX3";


    const supabaseClient =
        window.supabase.createClient(
            SUPABASE_URL,
            SUPABASE_ANON_KEY
        );


    /* ==========================================
       MESSAGE FUNCTION
    ========================================== */

    function showMessage(message, type) {

        const messageBox =
            document.getElementById("message");

        messageBox.innerText =
            message;

        messageBox.className =
            "message show " + type;

    }


    /* ==========================================
       REGISTRATION
    ========================================== */

    async function registerLearner(event) {

        event.preventDefault();


        const form =
            document.getElementById("registrationForm");

        const button =
            document.getElementById("registerButton");


        /* ======================================
           GET VALUES
        ====================================== */

        const name =
            document.getElementById("name")
                .value
                .trim();

        const surname =
            document.getElementById("surname")
                .value
                .trim();

        const email =
            document.getElementById("email")
                .value
                .trim()
                .toLowerCase();

        const contact =
            document.getElementById("contact")
                .value
                .trim();

        const grade =
            document.getElementById("grade")
                .value;

        const subject =
            document.getElementById("subject")
                .value;

        const password =
            document.getElementById("password")
                .value;

        const confirmPassword =
            document.getElementById("confirmPassword")
                .value;


        /* ======================================
           REQUIRED FIELD CHECK
        ====================================== */

        if (
            !name ||
            !surname ||
            !email ||
            !contact ||
            !grade ||
            !subject
        ) {

            showMessage(
                "Please complete all required fields.",
                "error"
            );

            return;
        }


        /* ======================================
           EMAIL CHECK
        ====================================== */

        const emailPattern =
            /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

        if (!emailPattern.test(email)) {

            showMessage(
                "Please enter a valid email address.",
                "error"
            );

            return;
        }


        /* ======================================
           PASSWORD CHECK
        ====================================== */

        if (password.length < 6) {

            showMessage(
                "Password must contain at least 6 characters.",
                "error"
            );

            return;
        }


        if (password !== confirmPassword) {

            showMessage(
                "Passwords do not match.",
                "error"
            );

            return;
        }


        /* ======================================
           DISABLE BUTTON
        ====================================== */

        button.disabled = true;

        button.innerText =
            "Creating Account...";


        showMessage(
            "Creating your MTHIS Tutorials account...",
            "loading"
        );


        try {

            /* ==================================
               CREATE SUPABASE AUTH ACCOUNT

               IMPORTANT:
               The learner information is stored
               in Auth metadata.

               The Supabase database trigger we
               created automatically creates the
               row in public.learners.
            ================================== */

            const {
                data: authData,
                error: authError
            } =
                await supabaseClient.auth.signUp({

                    email: email,

                    password: password,

                    options: {

                        data: {

                            name: name,

                            surname: surname,

                            contact: contact,

                            grade: grade,

                            subject: subject

                        }

                    }

                });


            /* ==================================
               CHECK AUTH ERROR
            ================================== */

            if (authError) {

                console.error(
                    "SUPABASE AUTH ERROR:",
                    authError
                );

                throw new Error(
                    authError.message
                );

            }


            /* ==================================
               CHECK USER
            ================================== */

            if (
                !authData ||
                !authData.user
            ) {

                throw new Error(
                    "Supabase did not return a user account."
                );

            }


            /* ==================================
               SUCCESS
            ================================== */

            /*
             * When email confirmation is enabled,
             * Supabase normally returns a user but
             * no session.
             */

            if (!authData.session) {

                showMessage(
                    "Account created successfully. Please check your email and confirm your account before logging in.",
                    "success"
                );

            } else {

                showMessage(
                    "Account created successfully. Redirecting to login...",
                    "success"
                );

            }


            /* ==================================
               CLEAR FORM
            ================================== */

            form.reset();


            button.innerText =
                "Account Created";


            /* ==================================
               REDIRECT TO LOGIN
            ================================== */

            setTimeout(function () {

                window.location.href =
                    "login.html";

            }, 3000);


        }

        catch (error) {

            console.error(
                "REGISTRATION ERROR:",
                error
            );


            let errorMessage =
                "Registration failed. Please try again.";


            if (error && error.message) {

                const message =
                    error.message.toLowerCase();


                if (
                    message.includes(
                        "already registered"
                    ) ||
                    message.includes(
                        "already been registered"
                    )
                ) {

                    errorMessage =
                        "This email address is already registered. Please use another email or login.";

                }

                else if (
                    message.includes(
                        "invalid email"
                    )
                ) {

                    errorMessage =
                        "Please enter a valid email address.";

                }

                else if (
                    message.includes(
                        "password"
                    )
                ) {

                    errorMessage =
                        error.message;

                }

                else if (
                    message.includes(
                        "database error"
                    )
                ) {

                    errorMessage =
                        "The account could not be saved to the learner database. Please contact the administrator.";

                }

                else {

                    errorMessage =
                        error.message;

                }

            }


            showMessage(
                errorMessage,
                "error"
            );


            /* ==================================
               ENABLE BUTTON AGAIN
            ================================== */

            button.disabled =
                false;

            button.innerText =
                "Create Learner Account";

        }

    }

</script>


</body>
</html>
