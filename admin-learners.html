<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>MTHIS Tutorials | Manage Learners</title>

    <link rel="stylesheet" href="style.css">

<style>
/* =========================================================
   MTHIS TUTORIALS
   ADMIN LEARNERS — FULL RESPONSIVE LAYOUT
   ========================================================= */

.admin-learners-page {
    margin: 0;
    min-height: 100vh;
    background: #f4f7fb;
    color: #14213d;
    font-family: Arial, Helvetica, sans-serif;
    overflow-x: hidden;
}

/* =========================================================
   HEADER
   ========================================================= */

.admin-learners-page .dashboard-header {
    width: 100%;
    min-height: 92px;
    padding: 0 5.5%;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 20px;
    background: linear-gradient(135deg, #020817, #061b3a);
    color: #fff;
    box-shadow: 0 8px 28px rgba(2, 8, 23, .18);
    position: relative;
    z-index: 20;
}

.admin-learners-page .brand {
    min-width: 0;
}

.admin-learners-page .brand h2 {
    margin: 0;
    color: #fff;
    font-size: 25px;
    line-height: 1.15;
    font-weight: 900;
}

.admin-learners-page .brand span {
    display: block;
    margin-top: 6px;
    color: #aebed4;
    font-size: 11px;
    font-weight: 800;
    letter-spacing: 1.8px;
    text-transform: uppercase;
}

.admin-learners-page .logout-btn {
    flex: 0 0 auto;
    min-height: 44px;
    padding: 0 20px;
    border: 1px solid rgba(22, 135, 255, .35);
    border-radius: 9px;
    background: rgba(255, 255, 255, .06);
    color: #fff;
    font: inherit;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    transition: .25s ease;
}

.admin-learners-page .logout-btn:hover {
    background: #0066ff;
    border-color: #0066ff;
    transform: translateY(-1px);
    box-shadow: 0 8px 20px rgba(0, 102, 255, .2);
}

/* =========================================================
   MAIN CONTAINER
   ========================================================= */

.admin-learners-page .dashboard {
    width: min(1200px, calc(100% - 48px));
    margin: 0 auto;
    padding: 48px 0 80px;
}

/* =========================================================
   WELCOME / PAGE TITLE
   ========================================================= */

.admin-learners-page .dashboard-welcome {
    margin: 0 0 48px;
}

.admin-learners-page .dashboard-welcome .small-title {
    margin: 0 0 9px;
    color: #0066ff;
    font-size: 12px;
    font-weight: 900;
    letter-spacing: 2px;
}

.admin-learners-page .dashboard-welcome h1 {
    margin: 0 0 10px;
    color: #102344;
    font-size: clamp(32px, 5vw, 48px);
    line-height: 1.1;
}

.admin-learners-page .dashboard-welcome > p:last-child {
    max-width: 680px;
    margin: 0;
    color: #65738a;
    font-size: 15px;
    line-height: 1.65;
}

/* =========================================================
   SECTION HEADING
   ========================================================= */

.admin-learners-page .section-heading {
    width: 100%;
    max-width: 850px;
    display: block !important;
    margin: 0 0 24px !important;
    padding: 0 !important;
}

.admin-learners-page .section-heading .small-title {
    display: block;
    margin: 0 0 9px;
    color: #0066ff;
    font-size: 12px;
    font-weight: 900;
    letter-spacing: 2px;
}

.admin-learners-page .section-heading h2 {
    display: block;
    margin: 0 0 9px !important;
    color: #102344;
    font-size: clamp(27px, 4vw, 38px) !important;
    line-height: 1.15;
}

.admin-learners-page #learnerCount {
    display: block;
    margin: 0 !important;
    color: #718096;
    font-size: 14px;
    line-height: 1.5;
}

/* =========================================================
   SEARCH / FILTER AREA
   ========================================================= */

.admin-learners-page .schedule-filter {
    width: 100%;
    display: grid !important;
    grid-template-columns:
        minmax(280px, 1.7fr)
        minmax(150px, .8fr)
        minmax(180px, 1fr)
        auto;
    align-items: center;
    gap: 12px;
    margin: 0 0 30px;
}

.admin-learners-page #searchLearner,
.admin-learners-page .schedule-filter select {
    width: 100%;
    height: 48px;
    min-width: 0;
    border: 1px solid #d5dce7;
    border-radius: 9px;
    outline: none;
    background: #fff;
    color: #172033;
    font: inherit;
    font-size: 14px;
    transition:
        border-color .25s ease,
        box-shadow .25s ease,
        background .25s ease;
}

.admin-learners-page #searchLearner {
    padding: 0 15px;
}

.admin-learners-page #searchLearner::placeholder {
    color: #98a2b3;
}

.admin-learners-page #searchLearner:hover,
.admin-learners-page .schedule-filter select:hover {
    border-color: #b8c5d6;
}

.admin-learners-page #searchLearner:focus,
.admin-learners-page .schedule-filter select:focus {
    background: #fff;
    border-color: #0066ff;
    box-shadow: 0 0 0 4px rgba(0, 102, 255, .10);
}

.admin-learners-page .schedule-filter select {
    padding: 0 35px 0 13px;
    cursor: pointer;
}

.admin-learners-page .schedule-filter > button {
    height: 48px;
    padding: 0 20px;
    border: 1px solid #0066ff;
    border-radius: 9px;
    background: #0066ff;
    color: #fff;
    font: inherit;
    font-size: 14px;
    font-weight: 700;
    white-space: nowrap;
    cursor: pointer;
    transition: .25s ease;
}

.admin-learners-page .schedule-filter > button:hover {
    background: #004fc7;
    border-color: #004fc7;
    transform: translateY(-1px);
    box-shadow: 0 8px 20px rgba(0, 102, 255, .18);
}

.admin-learners-page .schedule-filter > button:active {
    transform: translateY(0);
}

/* =========================================================
   LEARNER GRID
   ========================================================= */

.admin-learners-page #learnerList {
    width: 100%;
    min-width: 0;
    display: grid !important;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 22px;
}

/* =========================================================
   LEARNER CARD
   ========================================================= */

.admin-learners-page #learnerList .dashboard-card {
    width: 100%;
    min-width: 0;
    min-height: 100%;
    padding: 25px;
    display: flex;
    flex-direction: column;
    background: #fff;
    border: 1px solid #e2e8f0;
    border-radius: 17px;
    box-shadow: 0 10px 30px rgba(15, 35, 65, .06);
    overflow: hidden;
    transition:
        transform .25s ease,
        box-shadow .25s ease,
        border-color .25s ease;
}

.admin-learners-page #learnerList .dashboard-card:hover {
    transform: translateY(-4px);
    border-color: #c8dcff;
    box-shadow: 0 17px 38px rgba(15, 35, 65, .10);
}

/* =========================================================
   CARD ICON
   ========================================================= */

.admin-learners-page #learnerList .card-icon {
    width: 52px;
    height: 52px;
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 16px;
    border: 1px solid #d9e8ff;
    border-radius: 13px;
    background: linear-gradient(135deg, #edf5ff, #e7f7f4);
    color: #0066ff;
    font-size: 15px;
    font-weight: 900;
}

/* Empty icon gets a simple visual mark */
.admin-learners-page #learnerList .card-icon:empty::after {
    content: "";
    width: 18px;
    height: 18px;
    border: 2px solid #1687ff;
    border-radius: 50%;
    position: relative;
}

/* =========================================================
   CARD TITLE
   ========================================================= */

.admin-learners-page #learnerList .dashboard-card h3 {
    margin: 0 0 18px;
    color: #172033;
    font-size: 20px;
    line-height: 1.3;
    overflow-wrap: anywhere;
}

/* =========================================================
   INFORMATION
   ========================================================= */

.admin-learners-page #learnerList .schedule-info {
    width: 100%;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-top: auto;
}

.admin-learners-page #learnerList .schedule-item {
    min-width: 0;
    padding: 12px;
    border: 1px solid #edf0f4;
    border-radius: 10px;
    background: #f8fafc;
}

.admin-learners-page #learnerList .schedule-item strong {
    display: block;
    margin-bottom: 5px;
    color: #667085;
    font-size: 10px;
    font-weight: 800;
    letter-spacing: .7px;
    text-transform: uppercase;
}

.admin-learners-page #learnerList .schedule-item span {
    display: block;
    color: #172033;
    font-size: 13px;
    font-weight: 700;
    line-height: 1.45;
    overflow-wrap: anywhere;
    word-break: break-word;
}

.admin-learners-page #learnerList .schedule-item:nth-child(5) span {
    color: #0066ff;
}

.admin-learners-page #learnerList .schedule-item:nth-child(6) span {
    color: #1687ff;
}

/* =========================================================
   EMPTY / LOADING / ERROR STATE
   ========================================================= */

.admin-learners-page #learnerList > .dashboard-card:only-child {
    grid-column: 1 / -1;
    min-height: 260px;
    justify-content: center;
}

.admin-learners-page #learnerList > .dashboard-card:only-child:hover {
    transform: none;
}

/* =========================================================
   BACK BUTTON
   ========================================================= */

.admin-learners-page .support-section {
    margin-top: 50px;
    text-align: center;
}

.admin-learners-page .support-section .dashboard-button {
    min-height: 48px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    padding: 0 22px;
    border: 1px solid #d7e0ec;
    border-radius: 9px;
    background: #fff;
    color: #0066ff;
    text-decoration: none;
    font-size: 14px;
    font-weight: 700;
    transition: .25s ease;
}

.admin-learners-page .support-section .dashboard-button:hover {
    background: #0066ff;
    border-color: #0066ff;
    color: #fff;
    transform: translateY(-2px);
    box-shadow: 0 8px 20px rgba(0, 102, 255, .18);
}

/* =========================================================
   POPUP
   ========================================================= */

.admin-learners-page .popup {
    position: fixed;
    inset: 0;
    z-index: 9999;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 20px;
    background: rgba(2, 8, 23, .62);
    backdrop-filter: blur(5px);
}

.admin-learners-page .popup.show {
    display: flex;
}

.admin-learners-page .popup-box {
    position: relative;
    width: min(440px, 100%);
    padding: 30px;
    border-radius: 16px;
    background: #fff;
    box-shadow: 0 25px 70px rgba(0, 0, 0, .25);
}

.admin-learners-page .popup-close {
    position: absolute;
    top: 12px;
    right: 12px;
    width: 36px;
    height: 36px;
    border: 0;
    border-radius: 8px;
    background: #f1f4f8;
    color: #172033;
    cursor: pointer;
    font-size: 20px;
}

.admin-learners-page .popup-close:hover {
    background: #e8edf4;
}

.admin-learners-page .popup-box h2 {
    margin: 0 0 10px;
    color: #102344;
}

.admin-learners-page .popup-box p {
    margin: 0 0 20px;
    color: #65738a;
    line-height: 1.6;
}

.admin-learners-page .popup-box > button:last-child {
    min-height: 44px;
    padding: 0 18px;
    border: 0;
    border-radius: 8px;
    background: #0066ff;
    color: #fff;
    font: inherit;
    font-weight: 700;
    cursor: pointer;
}

/* =========================================================
   TABLET
   ========================================================= */

@media (max-width: 1050px) {
    .admin-learners-page #learnerList {
        grid-template-columns: repeat(2, minmax(0, 1fr));
    }

    .admin-learners-page .schedule-filter {
        grid-template-columns:
            minmax(220px, 1fr)
            minmax(140px, .7fr)
            minmax(160px, .8fr);
    }

    .admin-learners-page .schedule-filter > button {
        grid-column: 1 / -1;
        width: 100%;
    }
}

/* =========================================================
   SMALL TABLET
   ========================================================= */

@media (max-width: 800px) {
    .admin-learners-page .dashboard {
        width: min(94%, 720px);
        padding-top: 34px;
    }

    .admin-learners-page .schedule-filter {
        grid-template-columns: 1fr 1fr;
    }

    .admin-learners-page #searchLearner {
        grid-column: 1 / -1;
    }

    .admin-learners-page .schedule-filter > button {
        grid-column: 1 / -1;
    }
}

/* =========================================================
   MOBILE
   ========================================================= */

@media (max-width: 600px) {
    .admin-learners-page .dashboard-header {
        min-height: 78px;
        padding: 14px 18px;
    }

    .admin-learners-page .brand h2 {
        font-size: 20px;
    }

    .admin-learners-page .brand span {
        font-size: 9px;
        letter-spacing: 1.2px;
    }

    .admin-learners-page .logout-btn {
        min-height: 40px;
        padding: 0 14px;
        font-size: 13px;
    }

    .admin-learners-page .dashboard {
        width: calc(100% - 28px);
        padding: 28px 0 55px;
    }

    .admin-learners-page .dashboard-welcome {
        margin-bottom: 34px;
    }

    .admin-learners-page .dashboard-welcome h1 {
        font-size: 31px;
    }

    .admin-learners-page .section-heading h2 {
        font-size: 27px !important;
    }

    .admin-learners-page .schedule-filter {
        grid-template-columns: 1fr;
        gap: 10px;
    }

    .admin-learners-page #searchLearner,
    .admin-learners-page .schedule-filter select,
    .admin-learners-page .schedule-filter > button {
        grid-column: 1;
        width: 100%;
    }

    .admin-learners-page #learnerList {
        grid-template-columns: 1fr !important;
        gap: 16px;
    }

    .admin-learners-page #learnerList .dashboard-card {
        padding: 20px;
    }

    .admin-learners-page #learnerList .schedule-info {
        grid-template-columns: 1fr;
    }

    .admin-learners-page .support-section {
        margin-top: 36px;
    }

    .admin-learners-page .support-section .dashboard-button {
        width: 100%;
    }
}

/* =========================================================
   SMALL PHONES
   ========================================================= */

@media (max-width: 380px) {
    .admin-learners-page .dashboard {
        width: calc(100% - 20px);
    }

    .admin-learners-page .brand h2 {
        font-size: 18px;
    }

    .admin-learners-page .brand span {
        font-size: 8px;
    }

    .admin-learners-page .logout-btn {
        padding: 0 11px;
        font-size: 12px;
    }

    .admin-learners-page .dashboard-welcome h1 {
        font-size: 28px;
    }

    .admin-learners-page #learnerList .dashboard-card {
        padding: 17px;
    }
}

/* =========================================================
   ACCESSIBILITY
   ========================================================= */

.admin-learners-page button,
.admin-learners-page a,
.admin-learners-page input,
.admin-learners-page select {
    -webkit-tap-highlight-color: transparent;
}

.admin-learners-page button:focus-visible,
.admin-learners-page a:focus-visible,
.admin-learners-page input:focus-visible,
.admin-learners-page select:focus-visible {
    outline: 3px solid rgba(0, 102, 255, .22);
    outline-offset: 3px;
}

@media (prefers-reduced-motion: reduce) {
    .admin-learners-page *,
    .admin-learners-page *::before,
    .admin-learners-page *::after {
        transition-duration: .01ms !important;
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
    }
}
</style>


<style>
/* =========================================================
   FINAL MTHIS ALIGNMENT / SPACING POLISH
   ========================================================= */

.admin-learners-page,
.admin-learners-page * {
    box-sizing: border-box;
}

.admin-learners-page {
    text-align: left;
    line-height: 1.5;
}

/* Keep headings and descriptions consistently aligned */
.admin-learners-page h1,
.admin-learners-page h2,
.admin-learners-page h3,
.admin-learners-page p {
    text-align: left;
}

.admin-learners-page .dashboard-welcome h1 {
    letter-spacing: -0.5px;
    line-height: 1.12;
}

.admin-learners-page .dashboard-welcome > p:last-child {
    margin-top: 4px;
    line-height: 1.7;
}

/* Section title spacing */
.admin-learners-page .section-heading {
    margin-bottom: 26px !important;
}

.admin-learners-page .section-heading .small-title {
    margin-bottom: 8px;
    line-height: 1.3;
}

.admin-learners-page .section-heading h2 {
    margin-bottom: 8px !important;
    line-height: 1.2;
}

.admin-learners-page #learnerCount {
    line-height: 1.5;
}

/* Filter controls: equal height, clean internal spacing */
.admin-learners-page .schedule-filter {
    align-items: stretch;
}

.admin-learners-page #searchLearner,
.admin-learners-page .schedule-filter select,
.admin-learners-page .schedule-filter > button {
    height: 50px;
    min-height: 50px;
}

.admin-learners-page #searchLearner {
    padding: 0 16px;
    line-height: 50px;
}

.admin-learners-page .schedule-filter select {
    padding-left: 14px;
    padding-right: 36px;
    line-height: 50px;
}

.admin-learners-page .schedule-filter > button {
    padding-left: 22px;
    padding-right: 22px;
    line-height: 50px;
}

/* Learner cards */
.admin-learners-page #learnerList .dashboard-card {
    text-align: left;
    gap: 0;
}

.admin-learners-page #learnerList .card-icon {
    margin-bottom: 17px;
}

.admin-learners-page #learnerList .dashboard-card h3 {
    margin-bottom: 20px;
    line-height: 1.35;
    letter-spacing: -0.15px;
}

/* Information blocks have consistent label/value spacing */
.admin-learners-page #learnerList .schedule-info {
    align-items: stretch;
    gap: 10px;
}

.admin-learners-page #learnerList .schedule-item {
    display: flex;
    flex-direction: column;
    justify-content: flex-start;
    gap: 5px;
    min-height: 72px;
    padding: 12px 13px;
}

.admin-learners-page #learnerList .schedule-item strong {
    margin: 0;
    line-height: 1.25;
    white-space: nowrap;
}

.admin-learners-page #learnerList .schedule-item span {
    margin: 0;
    line-height: 1.45;
    text-align: left;
}

/* Make long email/contact values breathe instead of overflowing */
.admin-learners-page #learnerList .schedule-item span {
    overflow-wrap: anywhere;
    word-break: break-word;
}

/* Empty/loading/error cards */
.admin-learners-page #learnerList > .dashboard-card:only-child {
    text-align: center;
    align-items: center;
    padding: 38px 30px;
}

.admin-learners-page #learnerList > .dashboard-card:only-child h3,
.admin-learners-page #learnerList > .dashboard-card:only-child p {
    text-align: center;
}

.admin-learners-page #learnerList > .dashboard-card:only-child .card-icon {
    margin-left: auto;
    margin-right: auto;
}

/* Back button area */
.admin-learners-page .support-section {
    text-align: center;
}

.admin-learners-page .support-section .dashboard-button {
    line-height: 1.3;
    white-space: nowrap;
}

/* Popup typography */
.admin-learners-page .popup-box {
    text-align: left;
}

.admin-learners-page .popup-box h2 {
    line-height: 1.25;
}

.admin-learners-page .popup-box p {
    line-height: 1.65;
}

/* Mobile: prevent cramped words and controls */
@media (max-width: 600px) {
    .admin-learners-page .dashboard-welcome h1 {
        line-height: 1.15;
    }

    .admin-learners-page .dashboard-welcome > p:last-child {
        line-height: 1.65;
    }

    .admin-learners-page .schedule-filter {
        gap: 11px;
    }

    .admin-learners-page #learnerList .dashboard-card {
        padding: 20px;
    }

    .admin-learners-page #learnerList .dashboard-card h3 {
        line-height: 1.35;
    }

    .admin-learners-page #learnerList .schedule-item {
        min-height: 68px;
        padding: 12px 13px;
    }

    .admin-learners-page .support-section .dashboard-button {
        white-space: normal;
        text-align: center;
        line-height: 1.4;
        padding: 12px 18px;
    }
}
</style>

</head>

<body class="admin-learners-page">

<header class="dashboard-header">

    <div class="brand">

        <h2>MTHIS Tutorials</h2>

        <span>Administrator Portal</span>

    </div>

    <button
        class="logout-btn"
        onclick="adminLogout()">

        Logout

    </button>

</header>


<main class="dashboard">

    <section class="dashboard-welcome">

        <p class="small-title">
            ADMINISTRATION
        </p>

        <h1>
            Registered Learners
        </h1>

        <p>
            View and manage all learners registered
            with MTHIS Tutorials.
        </p>

    </section>


    <!-- SEARCH / FILTER -->

    <section>

        <div class="section-heading">

            <p class="small-title">
                LEARNER MANAGEMENT
            </p>

            <h2>
                All Registered Learners
            </h2>

            <p id="learnerCount">
                Loading learners...
            </p>

        </div>


        <div class="schedule-filter">

            <input
                type="text"
                id="searchLearner"
                placeholder="Search name, surname or email..."
                oninput="filterLearners()">


            <select
                id="gradeFilter"
                onchange="filterLearners()">

                <option value="All">
                    All Grades
                </option>

                <option value="Grade 11">
                    Grade 11
                </option>

                <option value="Grade 12">
                    Grade 12
                </option>

            </select>


            <select
                id="subjectFilter"
                onchange="filterLearners()">

                <option value="All">
                    All Subjects
                </option>

                <option value="Mathematics">
                    Mathematics
                </option>

                <option value="Physical Science">
                    Physical Science
                </option>

                <option value="Both">
                    Mathematics & Physical Science
                </option>

            </select>


            <button
                type="button"
                onclick="loadLearners()">

                Refresh

            </button>

        </div>

    </section>


    <!-- LEARNERS -->

    <section>

        <div
            id="learnerList"
            class="dashboard-grid">

            <div class="dashboard-card">

                <div class="card-icon">
                    
                </div>

                <h3>
                    Loading Learners
                </h3>

                <p>
                    Please wait...
                </p>

            </div>

        </div>

    </section>


    <!-- BACK -->

    <section class="support-section">

        <a
            href="admin.html"
            class="dashboard-button">

            ← Back to Admin Dashboard

        </a>

    </section>

</main>


<!-- POPUP -->

<div
    id="popup"
    class="popup">

    <div class="popup-box">

        <button
            class="popup-close"
            onclick="closePopup()">

            ×

        </button>

        <h2>
            MTHIS Tutorials
        </h2>

        <p id="popupMessage"></p>

        <button
            type="button"
            onclick="closePopup()">

            Close

        </button>

    </div>

</div>


<!-- SUPABASE -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script>

/* =====================================================
   SUPABASE
===================================================== */

const SUPABASE_URL =
    "https://bcpxdigpblgolreftfjx.supabase.co";


const SUPABASE_ANON_KEY =
    "sb_publishable_KMj2CtNM_uqqc5pjVh8V2Q_w9xydiX3";


const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_ANON_KEY
    );


/* =====================================================
   VARIABLES
===================================================== */

let allLearners = [];


/* =====================================================
   CHECK ADMIN
===================================================== */

async function checkAdmin() {

    const {
        data: {
            user
        },
        error
    } =
        await supabaseClient
            .auth
            .getUser();


    if (
        error ||
        !user
    ) {

        window.location.href =
            "admin-login.html";

        return null;

    }


    return user;

}


/* =====================================================
   LOAD LEARNERS
===================================================== */

async function loadLearners() {

    const list =
        document.getElementById(
            "learnerList"
        );


    const count =
        document.getElementById(
            "learnerCount"
        );


    list.innerHTML = `

        <div class="dashboard-card">

            <div class="card-icon">
                
            </div>

            <h3>
                Loading Learners
            </h3>

            <p>
                Please wait...
            </p>

        </div>

    `;


    try {

        const user =
            await checkAdmin();


        if (!user) {

            return;

        }


        const {
            data: learners,
            error
        } =
            await supabaseClient
                .from("learners")
                .select("*")
                .order(
                    "created_at",
                    {
                        ascending: false
                    }
                );


        if (error) {

            throw error;

        }


        allLearners =
            learners || [];


        count.innerText =
            allLearners.length +
            (
                allLearners.length === 1
                    ? " learner registered"
                    : " learners registered"
            );


        filterLearners();

    }

    catch (error) {

        console.error(
            "LEARNER LOAD ERROR:",
            error
        );


        count.innerText =
            "Unable to load learners.";


        list.innerHTML = `

            <div class="dashboard-card">

                <div class="card-icon">
                    
                </div>

                <h3>
                    Unable to Load Learners
                </h3>

                <p>
                    ${escapeHTML(
                        error.message
                    )}
                </p>

            </div>

        `;

    }

}


/* =====================================================
   FILTER LEARNERS
===================================================== */

function filterLearners() {

    const search =
        document.getElementById(
            "searchLearner"
        )
        .value
        .toLowerCase()
        .trim();


    const grade =
        document.getElementById(
            "gradeFilter"
        ).value;


    const subject =
        document.getElementById(
            "subjectFilter"
        ).value;


    let filtered =
        allLearners.filter(
            learner => {

                const fullName =
                    (
                        learner.name ||
                        ""
                    ) +
                    " " +
                    (
                        learner.surname ||
                        ""
                    );


                const email =
                    learner.email ||
                    "";


                const matchesSearch =
                    !search ||
                    fullName
                        .toLowerCase()
                        .includes(search) ||
                    email
                        .toLowerCase()
                        .includes(search);


                const matchesGrade =
                    grade === "All" ||
                    learner.grade === grade;


                const matchesSubject =
                    subject === "All" ||
                    learner.subject === subject;


                return (
                    matchesSearch &&
                    matchesGrade &&
                    matchesSubject
                );

            }
        );


    displayLearners(
        filtered
    );

}


/* =====================================================
   DISPLAY LEARNERS
===================================================== */

function displayLearners(
    learners
) {

    const list =
        document.getElementById(
            "learnerList"
        );


    const count =
        document.getElementById(
            "learnerCount"
        );


    if (
        learners.length === 0
    ) {

        list.innerHTML = `

            <div class="dashboard-card">

                <div class="card-icon">
                    
                </div>

                <h3>
                    No Learners Found
                </h3>

                <p>
                    No registered learners match
                    your search or filters.
                </p>

            </div>

        `;

        return;

    }


    list.innerHTML = "";


    learners.forEach(
        learner => {

            const card =
                document.createElement(
                    "div"
                );


            card.className =
                "dashboard-card";


            let subject =
                learner.subject ||
                "Not selected";


            if (
                subject === "Both"
            ) {

                subject =
                    "Mathematics & Physical Science";

            }


            card.innerHTML = `

                <div class="card-icon">
                    
                </div>


                <h3>
                    ${escapeHTML(
                        learner.name ||
                        "Unknown"
                    )}
                    ${escapeHTML(
                        learner.surname ||
                        ""
                    )}
                </h3>


                <div class="schedule-info">


                    <div class="schedule-item">

                        <strong>
                            Email
                        </strong>

                        <span>
                            ${escapeHTML(
                                learner.email ||
                                "Not available"
                            )}
                        </span>

                    </div>


                    <div class="schedule-item">

                        <strong>
                            Contact
                        </strong>

                        <span>
                            ${escapeHTML(
                                learner.contact_number ||
                                learner.phone ||
                                "Not available"
                            )}
                        </span>

                    </div>


                    <div class="schedule-item">

                        <strong>
                            Grade
                        </strong>

                        <span>
                            ${escapeHTML(
                                learner.grade ||
                                "Not selected"
                            )}
                        </span>

                    </div>


                    <div class="schedule-item">

                        <strong>
                            Subject
                        </strong>

                        <span>
                            ${escapeHTML(
                                subject
                            )}
                        </span>

                    </div>


                    <div class="schedule-item">

                        <strong>
                            Payment Status
                        </strong>

                        <span>
                            ${escapeHTML(
                                learner.payment_status ||
                                "Not set"
                            )}
                        </span>

                    </div>


                    <div class="schedule-item">

                        <strong>
                            Account Status
                        </strong>

                        <span>
                            ${escapeHTML(
                                learner.status ||
                                "Active"
                            )}
                        </span>

                    </div>


                </div>

            `;


            list.appendChild(
                card
            );

        }
    );

}


/* =====================================================
   LOGOUT
===================================================== */

async function adminLogout() {

    await supabaseClient
        .auth
        .signOut();


    window.location.href =
        "admin-login.html";

}


/* =====================================================
   POPUP
===================================================== */

function showMessage(
    message
) {

    document.getElementById(
        "popupMessage"
    ).innerText =
        message;


    document.getElementById(
        "popup"
    ).classList.add(
        "show"
    );

}


function closePopup() {

    document.getElementById(
        "popup"
    ).classList.remove(
        "show"
    );

}


/* =====================================================
   SECURITY
===================================================== */

function escapeHTML(
    value
) {

    return String(
        value ?? ""
    )

    .replace(
        /&/g,
        "&amp;"
    )

    .replace(
        /</g,
        "&lt;"
    )

    .replace(
        />/g,
        "&gt;"
    )

    .replace(
        /"/g,
        "&quot;"
    )

    .replace(
        /'/g,
        "&#039;"
    );

}


/* =====================================================
   START
===================================================== */

loadLearners();

</script>

</body>
